name: Build Debug APKs

on:
  workflow_dispatch:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  build_debug_apks:
    name: Build Debug APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build APKs
        run: |
          mkdir -p outputs

          # PLAY
          scripts/apply_flavor_play.sh
          flutter build apk \
            -t lib/main_play.dart \
            --flavor play \
            --debug
          cp build/app/outputs/flutter-apk/*.apk outputs/

          # IZZY
          scripts/apply_flavor_izzy.sh
          flutter build apk \
            -t lib/main_izzy.dart \
            --flavor izzy \
            --debug
          cp build/app/outputs/flutter-apk/*.apk outputs/

          # LIBRE
          scripts/apply_flavor_libre.sh
          flutter build apk \
            -t lib/main_libre.dart \
            --flavor libre \
            --debug
          cp build/app/outputs/flutter-apk/*.apk outputs/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: outputs/*.apk 
